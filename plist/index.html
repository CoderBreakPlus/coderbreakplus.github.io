    <style>

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text-main); margin: 0; padding: 20px; line-height: 1.6; overflow-x: hidden; scroll-behavior: smooth; }

        .stats-bar { display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); border: 1px solid var(--border); padding: 16px 20px; border-radius: 12px; margin-bottom: 24px; flex-wrap: wrap; gap: 10px; box-sizing: border-box; }

        @media (max-width: 640px) {

    <script>
        const ENABLE_PAGINATION = false; 

        let isDiffVisible = true;
        function toggleDiff() {
            isDiffVisible = !isDiffVisible;
            const btn = document.querySelector('.toggle-diff-btn');
            if (isDiffVisible) {
                btn.innerHTML = 'ðŸŒ• éšè—éš¾åº¦';
                btn.style.color = 'var(--primary)';
                btn.style.borderColor = '#bfdbfe';
                btn.style.background = '#fff';
            } else {
                btn.innerHTML = 'ðŸŒ‘ æ˜¾ç¤ºéš¾åº¦';
                btn.style.color = '#475569';
                btn.style.borderColor = '#e2e8f0';
                btn.style.background = '#f8fafc';
            }
            document.querySelectorAll('.diff-indicator').forEach(el => { el.style.display = isDiffVisible ? 'inline-flex' : 'none'; });
        }
        
        let isRemarkVisible = false;
        function toggleRemark() {
            isRemarkVisible = !isRemarkVisible;
            document.querySelectorAll('.remark-col').forEach(el => { el.style.display = isRemarkVisible ? 'table-cell' : 'none'; });
            document.querySelectorAll('.toggle-remark-btn').forEach(btn => {
                btn.innerHTML = isRemarkVisible ? 'ðŸš« éšè—å¤‡æ³¨' : 'ðŸ“ æ˜¾ç¤ºå¤‡æ³¨';
                btn.style.color = isRemarkVisible ? '#475569' : '#059669';
                btn.style.borderColor = isRemarkVisible ? '#e2e8f0' : '#a7f3d0';
                btn.style.background = isRemarkVisible ? '#f8fafc' : '#fff';
            });
        }

        function sortContests(type) {
            const tables = document.querySelectorAll('.matrix-table');
            tables.forEach(table => {
                const tbody = table.querySelector('tbody');
                if (!tbody) return;
                const rows = Array.from(tbody.querySelectorAll('tr'));
                rows.sort((a, b) => {
                    if (type === 'cid-asc' || type === 'cid-desc') {
                        const idA = /^[0-9]+$/.test(a.dataset.cid || '') ? Number(a.dataset.cid) : NaN;
                        const idB = /^[0-9]+$/.test(b.dataset.cid || '') ? Number(b.dataset.cid) : NaN;
                        // Contests without a number always come last.
                        if (Number.isNaN(idA) !== Number.isNaN(idB)) return Number.isNaN(idA) ? 1 : -1;
                        if (!Number.isNaN(idA) && idA !== idB) return (idA - idB) * (type === 'cid-asc' ? 1 : -1);
                        return a.dataset.name.localeCompare(b.dataset.name, undefined, {numeric: true});
                    } else if (type === 'count') {
                        return parseInt(b.dataset.count) - parseInt(a.dataset.count);
                    } else {
                        return b.dataset.name.localeCompare(a.dataset.name, undefined, {numeric: true});
                    }
                });
                rows.forEach(r => tbody.appendChild(r));
            });
        }

        function filterMatrixTable(inputEl, tableId) {
            const val = inputEl.value.toLowerCase().trim();
            const rows = document.querySelectorAll('#' + tableId + ' tbody tr');
            rows.forEach(row => {
                const cname = (row.getAttribute('data-name') || '').toLowerCase();
                const cid = (row.getAttribute('data-cid') || '').toLowerCase();
                if (cname.includes(val) || cid === val || 'c-' + cid === val || '#' + cid === val) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        let selectedContest = null;
        function centerContest(target, smooth=true) {
            if (!target || !target.getClientRects().length) return;
            // Supply only the extra space required at the document boundaries.
            document.body.style.paddingTop = '';
            document.body.style.paddingBottom = '';
            const style = getComputedStyle(document.body);
            const topPadding = parseFloat(style.paddingTop) || 0;
            const bottomPadding = parseFloat(style.paddingBottom) || 0;
            const rect = target.getBoundingClientRect();
            const center = rect.top + window.scrollY + rect.height / 2;
            const half = window.innerHeight / 2;
            const extraTop = Math.max(0, half - center);
            const extraBottom = Math.max(0, center + half - document.documentElement.scrollHeight);
            document.body.style.paddingTop = (topPadding + extraTop) + 'px';
            document.body.style.paddingBottom = (bottomPadding + extraBottom) + 'px';
            const behavior = smooth && !matchMedia('(prefers-reduced-motion: reduce)').matches ? 'smooth' : 'instant';
            window.scrollTo({top: center + extraTop - half, behavior});
        }
        function highlightContest(cid_id, updateUrl=true) {
            const target = document.getElementById(cid_id);
            if (!target || !target.matches('.matrix-table tbody tr')) return;
            document.querySelectorAll('.highlight-row').forEach(tr => tr.classList.remove('highlight-row'));
            target.classList.add('highlight-row');
            selectedContest = target;
            centerContest(target);
            if (updateUrl) {
                const url = new URL(window.location.href);
                url.hash = cid_id;
                window.history.replaceState(null, '', url);
            }
        }
        window.addEventListener('hashchange', () => highlightContest(window.location.hash.slice(1), false));
        window.addEventListener('resize', () => centerContest(selectedContest, false));

        function addTagToFilter(tag, tableId) {
            const input = document.getElementById('filter-tag-' + tableId);
            if (!input) return;
            let terms = input.value.trim().split(/\s+/).filter(t => t);
            const lowerTag = tag.toLowerCase();
            const index = terms.findIndex(t => t.toLowerCase() === lowerTag);
            if (index === -1) { terms.push(tag); } else { terms.splice(index, 1); }
            input.value = terms.length > 0 ? terms.join(' ') + ' ' : '';
            filterListTable(tableId);
            input.focus();
        }

        function clearTagFilter(tableId) {
            const input = document.getElementById('filter-tag-' + tableId);
            if (input) { input.value = ''; filterListTable(tableId); input.focus(); }
        }

        let currentPages = {};
        const itemsPerPage = 20;

        function filterListTable(tableId) {
            const input = document.getElementById('filter-tag-' + tableId);
            const tagVal = input ? input.value.toLowerCase().trim() : '';
            const searchTerms = tagVal.split(/\s+/).filter(t => t);
            
            const clearBtn = document.getElementById('clear-btn-' + tableId);
            if (clearBtn) { clearBtn.style.display = tagVal.length > 0 ? 'block' : 'none'; }
            
            const minInput = document.getElementById('filter-diff-min-' + tableId);
            const maxInput = document.getElementById('filter-diff-max-' + tableId);
            const minStr = minInput ? minInput.value : '';
            const maxStr = maxInput ? maxInput.value : '';
            const minVal = minStr !== '' ? parseFloat(minStr) : -Infinity;
            const maxVal = maxStr !== '' ? parseFloat(maxStr) : Infinity;

            const dateStart = document.getElementById('filter-date-start-' + tableId) ? document.getElementById('filter-date-start-' + tableId).value : '';
            const dateEnd = document.getElementById('filter-date-end-' + tableId) ? document.getElementById('filter-date-end-' + tableId).value : '';

            const mdCheckbox = document.getElementById('filter-has-md-' + tableId);
            const requireMd = mdCheckbox ? mdCheckbox.checked : false;

            if (tableId === 'summary-table' || tableId.startsWith('plan-table-') || tableId.startsWith('plist-')) {
                const url = new URL(window.location);
                if (tagVal) url.searchParams.set('q', tagVal); else url.searchParams.delete('q');
                if (minStr) url.searchParams.set('min', minStr); else url.searchParams.delete('min');
                if (maxStr) url.searchParams.set('max', maxStr); else url.searchParams.delete('max');
                if (requireMd) url.searchParams.set('has_md', '1'); else url.searchParams.delete('has_md');
                window.history.replaceState({}, '', url);
            }

            const rows = document.querySelectorAll('#' + tableId + ' tbody tr');
            const visibleRows = [];
            
            rows.forEach(row => {
                const tags = (row.getAttribute('data-tags') || '').toLowerCase();
                const baseName = (row.getAttribute('data-base') || '').toLowerCase();
                const diffStr = row.getAttribute('data-diff');
                const rDate = row.getAttribute('data-date');
                const hasMd = row.getAttribute('data-has-md') === '1';
                const diff = diffStr && diffStr !== 'None' ? parseFloat(diffStr) : NaN;

                let matchTag = true;
                if (searchTerms.length > 0) { matchTag = searchTerms.every(term => tags.includes(term) || baseName.includes(term)); }
                let matchDiff = true;
                if (minStr !== '' || maxStr !== '') {
                    if (isNaN(diff)) matchDiff = false;
                    else if (diff < minVal || diff > maxVal) matchDiff = false;
                }
                let matchDate = true;
                if (dateStart && (rDate === 'æœªçŸ¥' || rDate < dateStart)) matchDate = false;
                if (dateEnd && (rDate === 'æœªçŸ¥' || rDate > dateEnd)) matchDate = false;
                let matchMd = !requireMd || hasMd;

                if (matchTag && matchDiff && matchDate && matchMd) {
                    row.style.display = ''; 
                    visibleRows.push(row);
                } else {
                    row.style.display = 'none';
                }
            });
            
            if (ENABLE_PAGINATION) {
                updatePagination(tableId, visibleRows);
            } else {
                const controls = document.getElementById('pagination-controls-bottom-' + tableId);
                if (controls) controls.style.display = 'none';
            }
        }

        let sortDirection = {};
        function sortListTable(tableId, col) {
            if (!sortDirection[tableId]) sortDirection[tableId] = { 'diff': 1, 'date': 1, 'index': 1 };
            const tbody = document.querySelector('#' + tableId + ' tbody');
            if (!tbody) return;
            const rows = Array.from(tbody.querySelectorAll('tr'));
            sortDirection[tableId][col] *= -1;
            const dir = sortDirection[tableId][col];
            
            rows.sort((a, b) => {
                let res = 0;
                if (col === 'diff') {
                    let v1 = parseFloat(a.dataset.diff);
                    let v2 = parseFloat(b.dataset.diff);
                    if (isNaN(v1)) v1 = -Infinity;
                    if (isNaN(v2)) v2 = -Infinity;
                    res = (v1 - v2) * dir;
                } else if (col === 'date') {
                    let d1 = a.dataset.date;
                    let d2 = b.dataset.date;
                    if (d1 === 'æœªçŸ¥') d1 = '';
                    if (d2 === 'æœªçŸ¥') d2 = '';
                    res = d1.localeCompare(d2) * dir;
                } else if (col === 'index') {
                    let i1 = parseInt(a.dataset.index) || 0;
                    let i2 = parseInt(b.dataset.index) || 0;
                    res = (i1 - i2) * dir;
                }
                if (res === 0) {
                    let baseA = a.dataset.base || '';
                    let baseB = b.dataset.base || '';
                    return baseA.localeCompare(baseB, undefined, {numeric: true});
                }
                return res;
            });
            rows.forEach(r => tbody.appendChild(r));
            
            if (ENABLE_PAGINATION) {
                filterListTable(tableId);
            }
        }

        function updatePagination(tableId, allVisibleRows) {
            if (!ENABLE_PAGINATION) return;
            const totalItems = allVisibleRows.length;
            const totalPages = Math.max(1, Math.ceil(totalItems / itemsPerPage));
            
            if (!currentPages[tableId] || currentPages[tableId] > totalPages) {
                currentPages[tableId] = 1;
            }

            renderPaginationControls(tableId, totalPages);
            displayPageItems(tableId, allVisibleRows, currentPages[tableId]);
        }

        function renderPaginationControls(tableId, totalPages) {
            const container = document.getElementById('pagination-controls-bottom-' + tableId);
            if (!container) return;
            
            if (totalPages <= 1) { 
                container.style.display = 'none';
                return;
            }
            container.style.display = 'flex';
            container.innerHTML = ''; 
            
            const currentPage = currentPages[tableId];

            const prevBtn = document.createElement('button');
            prevBtn.className = 'pagination-btn';
            prevBtn.innerText = 'Â« ä¸Šä¸€é¡µ';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => changePage(tableId, currentPage - 1);
            container.appendChild(prevBtn);

            const pageWindow = 2; 
            let startPage = Math.max(1, currentPage - pageWindow);
            let endPage = Math.min(totalPages, currentPage + pageWindow);

            if (startPage > 1) {
                container.appendChild(createPageButton(tableId, 1, currentPage));
                if (startPage > 2) {
                    const ellipsis = document.createElement('span');
                    ellipsis.innerText = '...';
                    ellipsis.className = 'pagination-info';
                    container.appendChild(ellipsis);
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                container.appendChild(createPageButton(tableId, i, currentPage));
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    const ellipsis = document.createElement('span');
                    ellipsis.innerText = '...';
                    ellipsis.className = 'pagination-info';
                    container.appendChild(ellipsis);
                }
                container.appendChild(createPageButton(tableId, totalPages, currentPage));
            }

            const nextBtn = document.createElement('button');
            nextBtn.className = 'pagination-btn';
            nextBtn.innerText = 'ä¸‹ä¸€é¡µ Â»';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => changePage(tableId, currentPage + 1);
            container.appendChild(nextBtn);

            const pageInfo = document.createElement('span');
            pageInfo.className = 'pagination-info';
            pageInfo.innerText = 'ç¬¬ ' + currentPage + ' / ' + totalPages + ' é¡µ';
            container.appendChild(pageInfo);
        }

        function createPageButton(tableId, pageNum, currentPage) {
            const btn = document.createElement('button');
            btn.className = 'pagination-btn ' + (pageNum === currentPage ? 'active' : '');
            btn.innerText = pageNum;
            btn.onclick = () => changePage(tableId, pageNum);
            return btn;
        }

        function changePage(tableId, newPage) {
            currentPages[tableId] = newPage;
            filterListTable(tableId); 
        }

        function displayPageItems(tableId, allVisibleRows, page) {
            const startIndex = (page - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;

            allVisibleRows.forEach((row, index) => {
                if (index >= startIndex && index < endIndex) {
                    row.style.display = ''; 
                } else {
                    row.style.display = 'none'; 
                }
            });
        }

        function switchAtCoderTab(targetId, btn, updateUrl=true) {
            document.querySelectorAll('.atcoder-tab-content').forEach(el => el.style.display = 'none');
            document.getElementById(targetId).style.display = 'block';
            document.querySelectorAll('.atcoder-tab-btn').forEach(el => {
                el.style.background = '#fff';
                el.style.color = '#334155';
                el.style.borderColor = '#e2e8f0';
            });
            btn.style.background = 'var(--primary)';
            btn.style.color = '#fff';
            btn.style.borderColor = 'var(--primary)';
            
            if (updateUrl) {
                const url = new URL(window.location);
                url.searchParams.set('tab', targetId.replace('tab-', ''));
                url.searchParams.delete('sub'); 
                window.history.replaceState({}, '', url);
            }
            
            const currentTableId = document.querySelector(`#${targetId} .plan-sub-content[style*="display: block"] .normal-table`)?.id 
                                || document.querySelector(`#${targetId} .normal-table`)?.id;
            if (currentTableId) filterListTable(currentTableId);
        }
        
        function switchPlanSubTable(targetId, btn, updateUrl=true) {
            const parentTab = btn.closest('.atcoder-tab-content');
            if (!parentTab) return;
            
            parentTab.querySelectorAll('.plan-sub-content').forEach(el => el.style.display = 'none');
            const targetEl = document.getElementById(targetId);
            if (targetEl) targetEl.style.display = 'block';
            
            parentTab.querySelectorAll('.plan-sub-btn').forEach(el => {
                el.style.background = '#fff';
                el.style.color = '#334155';
                el.style.borderColor = '#e2e8f0';
            });
            btn.style.background = 'var(--primary)';
            btn.style.color = '#fff';
            btn.style.borderColor = 'var(--primary)';

            if (updateUrl) {
                const url = new URL(window.location);
                const parts = targetId.split('-');
                if (parts.length >= 2) {
                    url.searchParams.set('sub', parts[1]); 
                    window.history.replaceState({}, '', url);
                }
            }

            const currentTableId = document.querySelector(`#${targetId} .normal-table`)?.id;
            if (currentTableId) filterListTable(currentTableId);
        }
        
        function filterPList() {
            const val = document.getElementById('plist-search').value.toLowerCase();
            document.querySelectorAll('.plist-card').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(val) ? '' : 'none';
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const q = urlParams.get('q');
            const min = urlParams.get('min');
            const max = urlParams.get('max');
            const hasMdParam = urlParams.get('has_md');
            const tabParam = urlParams.get('tab');
            const subParam = urlParams.get('sub');

            if (tabParam) {
                const btn = document.querySelector(`button[data-target="tab-${tabParam}"]`);
                if (btn) switchAtCoderTab(`tab-${tabParam}`, btn, false);
            }

            if (subParam) {
                const activeTab = document.querySelector('.atcoder-tab-content[style*="display: block"]');
                if (activeTab) {
                    const targetIdPrefix = `sub-${subParam}-`;
                    const subBtn = Array.from(activeTab.querySelectorAll('.plan-sub-btn')).find(b => b.getAttribute('onclick').includes(targetIdPrefix));
                    if (subBtn) {
                        const match = subBtn.getAttribute('onclick').match(/'([^']+)'/);
                        if (match) switchPlanSubTable(match[1], subBtn, false);
                    }
                }
            }

            const input = document.querySelector('input[id^="filter-tag-"]');
            if (input && (input.id === 'filter-tag-summary-table' || input.id.startsWith('filter-tag-plan-table-') || input.id.startsWith('filter-tag-plist-'))) {
                const tableId = input.id.replace('filter-tag-', '');
                if (q) input.value = q + ' ';
                const minInput = document.getElementById('filter-diff-min-' + tableId);
                if (minInput && min) minInput.value = min;
                const maxInput = document.getElementById('filter-diff-max-' + tableId);
                if (maxInput && max) maxInput.value = max;
                
                const mdCheckbox = document.getElementById('filter-has-md-' + tableId);
                if (mdCheckbox && hasMdParam === '1') mdCheckbox.checked = true;
                
                filterListTable(tableId); 
            }

            document.querySelectorAll('.plan-sub-content[style*="display: block"] .normal-table').forEach(table => {
                filterListTable(table.id);
            });
            if (document.getElementById('summary-table')) {
                filterListTable('summary-table');
            }
            
            if(window.location.hash && window.location.hash.startsWith('#c-')) {
                requestAnimationFrame(() => highlightContest(window.location.hash.substring(1), false));
            }

        });
    </script>
</body>
</html>
